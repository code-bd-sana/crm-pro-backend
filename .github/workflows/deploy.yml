name: Deploy NestJS App

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_CRM_PRO }}
          script: |
            cd ~/apps/crm-pro/backend
            git pull origin main
            source ~/.nvm/nvm.sh
            nvm use
            npm ci
            npm run build
            pm2 restart crm-pro-backend